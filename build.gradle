plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'  // Create fat JAR
    id 'com.diffplug.spotless' version '6.25.0'  // Code formatting
    id 'org.sonarqube' version '6.0.1.5171'
}

group = 'com.todo'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Dropwizard Core
    implementation("io.dropwizard:dropwizard-core:4.0.12")
    implementation 'io.dropwizard:dropwizard-jetty:4.0.12'

    // Dropwizard Hibernate (JPA support)
    implementation("io.dropwizard:dropwizard-hibernate:4.0.12")

    // Hibernate Validator for Jakarta
    implementation("org.hibernate.validator:hibernate-validator:8.0.0.Final")
    implementation 'org.glassfish:jakarta.el:4.0.2'

    // SQLite JDBC Driver
    implementation("org.xerial:sqlite-jdbc:3.45.1.0")

    // Hibernate ORM for SQLite
    implementation("org.hibernate:hibernate-core:6.3.1.Final")

    // GraphQL Java
    implementation("com.graphql-java:graphql-java:21.2")

    // GraphQL Java Servlet
    implementation("com.graphql-java-kickstart:graphql-java-servlet:13.0.0")
    implementation("com.graphql-java-kickstart:graphql-java-tools:13.0.0")

    // Jackson for JSON processing (included with Dropwizard)
    implementation("com.fasterxml.jackson.core:jackson-databind:2.17.1")

    // Dropwizard JDBI
    implementation 'io.dropwizard:dropwizard-jdbi3:3.0.9'

    // Jakarta APIs
    implementation 'jakarta.ws.rs:jakarta.ws.rs-api:3.1.0'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.0'
    implementation 'jakarta.servlet:jakarta.servlet-api:5.0.0'

    // Lombok (Auto-generate Getters/Setters)
    implementation 'org.projectlombok:lombok:1.18.36'
    annotationProcessor 'org.projectlombok:lombok:1.18.36'

    // Testing dependencies
    testImplementation("io.dropwizard:dropwizard-testing:4.0.12")
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
}

configurations.all {
    exclude group: 'javax.servlet', module: 'javax.servlet-api'
}

application {
    mainClass = 'com.todo.ToDoApplication'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs = ['-Dfile.encoding=UTF-8']
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.todo.ToDoApplication'
        )
    }
}

shadowJar {
    mergeServiceFiles()  // Merge service files like META-INF/services
    archiveClassifier.set('all')  // Naming the fat JAR with '-all' suffix
    manifest {
        attributes(
                'Main-Class': 'com.todo.ToDoApplication'
        )
    }
}


task copyRuntimeDependencies(type: Copy) {
    from configurations.runtimeClasspath
    into 'build/dependency'
}

build.dependsOn copyRuntimeDependencies

test {
    useJUnitPlatform()
}

